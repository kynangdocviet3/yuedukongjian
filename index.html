<script>
const lessons=[
{title:"根据形旁猜测字词的意思",author:"《拾级汉语泛读课本》第五级",translation:`Trong tiếng Hán có rất nhiều chữ hình thanh. Chữ hình thanh là những chữ được cấu tạo bởi hai bộ phận: hình bàng (形旁) và thanh bàng (声旁). Hình bàng biểu thị ý nghĩa của chữ có liên quan đến lĩnh vực hay sự vật nào, còn thanh bàng gợi ý về cách phát âm của chữ. Hình bàng của chữ Hán ở một mức độ nhất định có thể giúp chúng ta hiểu được ý nghĩa của chữ đó.
Ví dụ, hình bàng của “蝴” là “虫”, cho biết ý nghĩa của chữ này có liên quan đến “côn trùng”; hình bàng của “滴” là “三点水”, cho biết ý nghĩa của chữ này có liên quan đến “nước”; còn hình bàng của “踢” là “足”, cho biết ý nghĩa của chữ này có liên quan đến “chân”.
Cần lưu ý rằng chữ Hán đã trải qua một khoảng thời gian rất dài, từ khi hình thành, phát triển, biến đổi cho đến ngày nay. Trong quá trình đó, sự vật đã có nhiều thay đổi, cách nhìn của con người cũng thay đổi, từ đó dẫn đến hiện tượng hình bàng của chữ hình thanh không còn hoàn toàn phù hợp với sự vật mà nó đại diện.
Ví dụ, hình bàng của chữ “镜” là “金”, biểu thị kim loại. Sở dĩ như vậy là vì khi chữ Hán này được tạo ra ở Trung Quốc cổ đại, gương được làm từ một loại kim loại là đồng. Mặc dù gương hiện đại đều được làm bằng thủy tinh, nhưng bản thân chữ Hán này vẫn không thay đổi.
Việc hiểu rõ hình bàng của chữ Hán có thể giúp chúng ta hiểu sâu hơn về chữ Hán, đồng thời nâng cao khả năng đoán từ của bản thân. Đặc biệt trong trường hợp có ngữ cảnh và những gợi ý từ văn cảnh, việc dựa vào hình bàng của chữ Hán để đoán nghĩa của từ càng trở nên quan trọng hơn.`,text:`汉语中有很多形声字。所谓形声字，是指这些字由两部分组成：形旁和声旁。形旁表示这个字的意思跟什么有关系，声旁提示这个字的读音。
汉字的形旁在一定程度上可以帮助我们理解这个汉字的意思。例如“蝴”的形旁是“虫”，表示这个字的意思和“虫子”有关；“滴”的形旁是“三点水”，表示这个字的意思和“水”有关；而“踢”的形旁是“足”，表示这个字的意思和“脚”有关。
需要注意的是，汉字从形成、发展、演变一直到现在，经历了很长的时间，在这个过程中，事物发生了很多变化，人们的看法也有了改变，这就导致形声字的形旁和它所代表的事物之间出现不一致的现象。例如“镜”字的形旁是“金”，表示金属，这是因为在中国古代造这个汉字的时候，镜子就是由铜这种金属制作的，虽然现代的镜子都是由玻璃做的，但是汉字本身并没有改变。
了解汉字的形旁，可以加深我们对汉字的认识，增强自己的猜词能力，尤其是在有语境和上下文提示的情况下，通过汉字的形旁来猜测词义，变得更加重要。`,
vocab:[["形声字","xíngshēngzì","chữ hình thanh"],["形旁","xíngpáng","bộ phận biểu ý"],["声旁","shēngpáng","bộ phận biểu âm"],["表示","biǎoshì","biểu thị"],["提示","tíshì","gợi ý; chỉ ra"],["在一定程度上","zài yídìng chéngdù shàng","ở một mức độ nhất định"],["理解","lǐjiě","hiểu; lý giải"],["蝴","hú","bướm"],["滴","dī","nhỏ giọt; giọt"],["踢","tī","đá"],["形成","xíngchéng","hình thành"],["演变","yǎnbiàn","biến đổi; phát triển"],["事物","shìwù","sự vật; sự việc"],["导致","dǎozhì","dẫn đến"],["不一致","bù yízhì","không nhất quán"],["铜","tóng","đồng"],["制作","zhìzuò","chế tạo"],["加深","jiāshēn","làm sâu sắc hơn"],["增强","zēngqiáng","tăng cường"],["猜词能力","cāicí nénglì","khả năng đoán từ"]],

quiz:[["“形声字”的意思是？",["làm sâu sắc hơn","biểu thị","đá","chữ hình thanh"],3,"“形声字”的意思是“chữ hình thanh”。"],["“形旁”的意思是？",["gợi ý; chỉ ra","đồng","bộ phận biểu ý","hình thành"],2,"“形旁”的意思是“bộ phận biểu ý”。"],["“声旁”的意思是？",["bộ phận biểu ý","đá","biểu thị","bộ phận biểu âm"],3,"“声旁”的意思是“bộ phận biểu âm”。"],["“表示”的意思是？",["ở một mức độ nhất định","bộ phận biểu ý","không nhất quán","biểu thị"],3,"“表示”的意思是“biểu thị”。"],["“提示”的意思是？",["chế tạo","bộ phận biểu âm","sự vật; sự việc","gợi ý; chỉ ra"],3,"“提示”的意思是“gợi ý; chỉ ra”。"],["“在一定程度上”的意思是？",["ở một mức độ nhất định","chữ hình thanh","sự vật; sự việc","dẫn đến"],0,"“在一定程度上”的意思是“ở một mức độ nhất định”。"],["“理解”的意思是？",["gợi ý; chỉ ra","bộ phận biểu ý","hiểu; lý giải","dẫn đến"],2,"“理解”的意思是“hiểu; lý giải”。"],["“蝴”的意思是？",["gợi ý; chỉ ra","biến đổi; phát triển","bướm","tăng cường"],2,"“蝴”的意思是“bướm”。"],["“滴”的意思是？",["nhỏ giọt; giọt","hình thành","biến đổi; phát triển","chữ hình thanh"],0,"“滴”的意思是“nhỏ giọt; giọt”。"],["“踢”的意思是？",["hình thành","đồng","chế tạo","đá"],3,"“踢”的意思是“đá”。"],["“形成”的意思是？",["hình thành","hiểu; lý giải","nhỏ giọt; giọt","dẫn đến"],0,"“形成”的意思是“hình thành”。"],["“演变”的意思是？",["bướm","đá","chữ hình thanh","biến đổi; phát triển"],3,"“演变”的意思是“biến đổi; phát triển”。"],["“事物”的意思是？",["biến đổi; phát triển","sự vật; sự việc","làm sâu sắc hơn","dẫn đến"],1,"“事物”的意思是“sự vật; sự việc”。"],["“导致”的意思是？",["gợi ý; chỉ ra","chế tạo","dẫn đến","biến đổi; phát triển"],2,"“导致”的意思是“dẫn đến”。"],["“不一致”的意思是？",["không nhất quán","đá","chữ hình thanh","sự vật; sự việc"],0,"“不一致”的意思是“không nhất quán”。"],["“铜”的意思是？",["biểu thị","chữ hình thanh","bộ phận biểu âm","đồng"],3,"“铜”的意思是“đồng”。"],["“制作”的意思是？",["hình thành","chế tạo","bộ phận biểu âm","sự vật; sự việc"],1,"“制作”的意思是“chế tạo”。"],["“加深”的意思是？",["làm sâu sắc hơn","không nhất quán","bộ phận biểu ý","ở một mức độ nhất định"],0,"“加深”的意思是“làm sâu sắc hơn”。"],["“增强”的意思是？",["nhỏ giọt; giọt","đá","sự vật; sự việc","tăng cường"],3,"“增强”的意思是“tăng cường”。"],["“猜词能力”的意思是？",["chế tạo","khả năng đoán t {title:"简体繁体，各有千秋",author:"徐宗伟 · 中国新闻网",translation:`Cuộc tranh luận về chữ Hán phồn thể và chữ Hán giản thể đã kéo dài hơn một trăm năm mà chưa bao giờ chấm dứt, những năm gần đây dường như còn trở nên sôi nổi hơn. Chỉ cần có người Trung Quốc, ở đó sẽ có những cách nhìn khác nhau. Điều này cho thấy rõ rằng tất cả con cháu Viêm Hoàng đều đang quan tâm đến chữ Hán, đồng thời cũng quan tâm đến nền văn hóa Trung Hoa mà chữ Hán đại diện.
Chữ viết là công cụ chủ yếu để một dân tộc kế thừa văn hóa. Lịch sử phát triển của chữ Hán cũng luôn gắn bó mật thiết với lịch sử năm nghìn năm của dân tộc Trung Hoa. Như chúng ta đều biết, chữ giản thể bắt nguồn từ dạng chữ viết tay được người dân tự giản hóa trong lịch sử, được xây dựng trên cơ sở chữ phồn thể. Vì vậy, không thể nhân danh văn hóa truyền thống mà phủ nhận chữ giản thể. Trong việc phổ biến và sử dụng rộng rãi chữ Hán, chữ giản thể đã đóng góp rất lớn. Hơn năm mươi năm kể từ khi Trung Quốc đại lục phổ biến chữ giản thể, tỷ lệ người mù chữ ngày càng giảm; người nước ngoài học chữ Hán cũng được hưởng lợi rất nhiều từ chữ giản thể.
Nói một cách công bằng, chữ phồn thể và chữ giản thể đều là sự kế thừa và phát triển của chữ Hán. Nếu không có kế thừa thì nói gì đến phát triển? Chữ phồn thể và chữ giản thể hoàn toàn có thể cùng tồn tại mà không cản trở lẫn nhau. Chữ phồn thể được sử dụng trong viết chữ, đặc biệt là trong các sáng tác nghệ thuật, mang đậm nét duyên truyền thống của văn hóa Trung Hoa, quả thực vô cùng tinh tế và khó diễn tả bằng lời. Hơn nữa, những đồng bào Hồng Kông, Ma Cao, Đài Loan vốn quen sử dụng chữ phồn thể, cộng thêm đông đảo người Hoa ở nước ngoài, có số lượng rất lớn. Còn chữ giản thể thì dù đọc, nhận diện hay viết đều dễ học, dễ nhớ, hiệu quả viết chữ cao. Qua thống kê sơ bộ nét chữ của hơn 2.000 chữ Hán thường dùng, có thể thấy số nét trung bình của chữ giản thể ít hơn chữ phồn thể ít nhất một phần ba. Ý nghĩa của điều này đối với đời sống xã hội hiện đại là điều quá rõ ràng. Ngoài ra, chữ giản thể cũng hoàn toàn không phải là không có giá trị nghệ thuật. Một số mẫu chữ thư pháp viết bằng bút cứng sử dụng chữ giản thể nhưng vẫn ngay ngắn, thanh tú và có giá trị thưởng thức. Chữ Hán viết có đẹp hay không không nằm ở việc phồn hay giản, mà phụ thuộc vào nền tảng nghệ thuật của mỗi người.
Chữ phồn thể và chữ giản thể mỗi bên đều có thế mạnh riêng. Đối với những ý kiến khác nhau và các cuộc tranh luận xoay quanh chúng, theo tôi, tất cả đều nên chấm dứt. Về vấn đề này, không nên có khuynh hướng chính trị hóa. Một số nhân vật có ảnh hưởng trong giới chính trị và học thuật đề xướng quan điểm “nhận biết chữ phồn, viết chữ giản”, tức là có thể nhận biết chữ phồn thể nhưng khi viết vẫn sử dụng chữ giản thể. Tôi rất đồng tình với quan điểm này. Đây là một ý tưởng hay! Nó vượt ra khỏi quan điểm “hoặc cái này hoặc cái kia”, không đi đến cực đoan. Quan điểm này đề xướng rằng những người quen dùng chữ phồn thể nên cố gắng có thể nhận biết, đọc và viết chữ giản thể; những người quen dùng chữ giản thể thì nên cố gắng có thể nhận biết và đọc chữ phồn thể. Đồng thời, để các loại ấn phẩm chính thức ở các khu vực khác nhau được xuất bản theo thông lệ riêng, mỗi loại đều có vị trí thích hợp, qua đó thể hiện tư tưởng “hòa mà không đồng nhất” . “Nhận biết chữ phồn, viết chữ giản” sẽ trở thành quan điểm dễ đạt được sự thống nhất nhất giữa người sử dụng chữ Hán ở hai bờ eo biển Đài Loan, cũng như giữa những người sử dụng chữ Hán trên toàn thế giới.`,text:`汉字的繁体字与简体字之争—百余年来从未中断过，而近年来好像更热闹起来，只要有中国人的地方，就有不同看法。这充分说明，所有的炎黄子孙，都在关注汉字，也关注汉字代表的中华文化。
文字是一个民族传承文化的主要工具。汉字的演变史，也始终与五千年的中华民族史密切相关。众所周知，简体字源于历史上人们自行简化的手写体，它是以繁体字为基础的，不能打着传统文化的旗号去否认简体字。在汉字的广泛推广与使用上，简体字功不可没。中国大陆推广简体字五十多年来，文盲的比例越来越小，外国人学汉字也从简体字中受益匪浅。
平心而论，繁体字、简体字都是汉字的继承与发展，没有继承谈何发展？简体字、繁体字完全可以并行不悖。繁体字用于书写特别是用于艺术类的创作，那种中华文化的传统韵味妙不可言；而简体字，无论读、认、书写皆好学、好记，书写效率高。通过对两千多个常用汉字笔画所作的粗略统计发现，简体字平均笔画至少比繁体字少了三分之一以上，对现代社会生活有什么样的意义，不言自明。此外，简体字也绝非毫无艺术可言，一些硬笔书法字帖，写的是简体字，但同样工整秀丽，很有欣赏价值。汉字书写是否美观并不在于繁与简，而要靠自家的艺术功底。
繁体字、简体字各有千秋。针对它们的不同意见，各种争论，我认为都应该停止。在这个问题上，不要有政治化倾向。一些有影响的政界、学界人士倡导“识繁书简”，也就是能够认识繁体字，但书写还是用简体字。我颇有同感。这是个好主意！它跳出了非此即彼的观点，没有走极端。它倡导习惯于繁体字的，尽可能做到能认、能读、能写简体字；习惯于简体字的，尽可能做到能认、能读繁体字；让各地的各种正规出版物依惯例，各得其所，体现了“和而不同”的思想。“识繁书简”将会成为海峡两岸乃至全球汉字使用者最容易取得一致的观点。`,

patterns:[["只要……，就……","表示条件关系。","Chỉ cần…… thì……","只要有中国人的地方，就有不同看法。"],["……从未……过","表示从过去到现在一直没有发生某事。","Từ trước đến nay chưa từng……","百余年来从未中断过。"],["越来越……","表示程度不断增加或变化。","Ngày càng……","文盲的比例越来越小。"],["与……密切相关","表示两者有紧密联系。","Có liên quan mật thiết với……","汉字的演变史，也始终与五千年的中华民族史密切相关。"],["众所周知，……","表示引出众所周知的信息。","Như mọi người đều biết……","众所周知，简体字源于历史上人们自行简化的手写体。"],["源于……","表示起源于某处或某种情况。","Bắt nguồn từ……","简体字源于历史上人们自行简化的手写体。"],["以……为基础","表示把某事物作为基础。","Lấy…… làm cơ sở/nền tảng。","它是以繁体字为基础的。"],["不能……去……","表示不能用某种方式去做某事。","Không thể/không nên dùng…… để……","不能打着传统文化的旗号去否认简体字。"],["在……上","表示关于某方面或某问题。","Về……; trong vấn đề……","在汉字的广泛推广与使用上……"],["平心而论，……","表示客观、公平地看待问题。","Công bằng mà nói……; xét một cách khách quan……","平心而论，繁体字、简体字都是汉字的继承与发展。"],["没有……，谈何……？","表示反问，强调前提的重要性。","Không có…… thì nói gì đến……?","没有继承谈何发展？"],["可以……，也可以……","表示两种形式都可以存在。","Có thể…… cũng có thể……","简体字、繁体字完全可以并行不悖。"],["特别是……","表示特别强调某一方面。","Đặc biệt là……","繁体字用于书写特别是用于艺术类的创作。"],["无论……，……都……","表示不管什么情况，结果都不改变。","Cho dù…… thì đều……","无论读、认、书写皆好学、好记。"],["至少……以上","表示数量或程度的最低限度。","Ít nhất…… trở lên。","简体字平均笔画至少比繁体字少了三分之一以上。"],["对……有什么样的意义","表示询问某事对某方面的意义。","Có ý nghĩa như thế nào đối với……","对现代社会生活有什么样的意义。"],["并不在于……，而要……","表示否定前一种判断，强调真正条件。","Không nằm ở…… mà cần……","汉字书写是否美观并不在于繁与简，而要靠自家的艺术功底。"],["各有千秋","表示各自都有自己的特点或优点。","Mỗi bên đều có ưu điểm/nét đặc sắc riêng。","繁体字、简体字各有千秋。"],["也就是……","表示换一种说法进一步说明。","Tức là……; nói cách khác là……","也就是能够认识繁体字，但书写还是用简体字。"],["尽可能做到……","表示尽量达到某种程度。","Cố gắng hết sức để làm được……","尽可能做到能认、能读、能写简体字。"],["跳出……的观点","表示摆脱某种观点或思维方式。","Thoát khỏi quan điểm……","它跳出了非此即彼的观点。"],["没有……，……","表示否定某种情况或行为。","Không…… thì……","没有走极端。"],["让……","表示使某人或某事物做某事。","Khiến/để cho……","让各地的各种正规出版物依惯例，各得其所。"],["各得其所","表示各自处在合适的位置或状态。","Mỗi bên đều có vị trí phù hợp。","让各地的各种正规出版物依惯例，各得其所。"],["乃至……","表示范围进一步扩大到更远的层次。","Cho đến……; thậm chí đến……","海峡两岸乃至全球汉字使用者。"],["最容易……的……","表示某事物在某范围内最容易实现某结果。","…… dễ nhất……","最容易取得一致的观点。"]],
quiz:[["“中断”的意思是？",["liên quan mật thiết","không cần nói cũng rõ","ngay ngắn","gián đoạn"],3,"“中断”的意思是“gián đoạn”。"],["“炎黄子孙”的意思是？",["con cháu Viêm Hoàng","ngay ngắn","bắt nguồn từ","thanh tú; đẹp đẽ"],0,"“炎黄子孙”的意思是“con cháu Viêm Hoàng”。"],["“传承”的意思是？",["kế thừa; truyền thừa","được hưởng lợi nhiều","cùng tồn tại không mâu thuẫn","có đóng góp quan trọng"],0,"“传承”的意思是“kế thừa; truyền thừa”。"],["“演变史”的意思是？",["kế thừa; truyền thừa","như mọi người đều biết","bắt nguồn từ","lịch sử biến đổi"],3,"“演变史”的意思是“lịch sử biến đổi”。"],["“密切相关”的意思是？",["được hưởng lợi nhiều","liên quan mật thiết","không cần nói cũng rõ","công bằng mà nói"],1,"“密切相关”的意思是“liên quan mật thiết”。"],["“众所周知”的意思是？",["gián đoạn","mỗi bên có nét đặc sắc riêng","như mọi người đều biết","bắt nguồn từ"],2,"“众所周知”的意思是“như mọi người đều biết”。"],["“源于”的意思是？",["lịch sử biến đổi","cùng tồn tại không mâu thuẫn","sơ lược","bắt nguồn từ"],3,"“源于”的意思是“bắt nguồn từ”。"],["“旗号”的意思是？",["như mọi người đều biết","danh nghĩa; khẩu hiệu","không cần nói cũng rõ","con cháu Viêm Hoàng"],1,"“旗号”的意思是“danh nghĩa; khẩu hiệu”。"],["“功不可没”的意思是？",["không cần nói cũng rõ","có đóng góp quan trọng","bắt nguồn từ","thanh tú; đẹp đẽ"],1,"“功不可没”的意思是“có đóng góp quan trọng”。"],["“受益匪浅”的意思是？",["kế thừa; truyền thừa","được hưởng lợi nhiều","danh nghĩa; khẩu hiệu","cùng tồn tại không mâu thuẫn"],1,"“受益匪浅”的意思是“được hưởng lợi nhiều”。"],["“平心而论”的意思是？",["hoặc cái này hoặc cái kia","phong vị; nét đặc sắc","thanh tú; đẹp đẽ","công bằng mà nói"],3,"“平心而论”的意思是“công bằng mà nói”。"],["“并行不悖”的意思是？",["hoặc cái này hoặc cái kia","cùng tồn tại không mâu thuẫn","danh nghĩa; khẩu hiệu","bắt nguồn từ"],1,"“并行不悖”的意思是“cùng tồn tại không mâu thuẫn”。"],["“韵味”的意思是？",["không cần nói cũng rõ","gián đoạn","phong vị; nét đặc sắc","nền tảng kỹ năng"],2,"“韵味”的意思是“phong vị; nét đặc sắc”。"],["“粗略”的意思是？",["công bằng mà nói","con cháu Viêm Hoàng","như mọi người đều biết","sơ lược"],3,"“粗略”的意思是“sơ lược”。"],["“不言自明”的意思是？",["như mọi người đều biết","nền tảng kỹ năng","không cần nói {title:"读书两“忌”",author:"陈先达 · 《北京日报》",translation:`Đọc sách có hai điều “kỵ”: một là “đọc gì thì tin nấy”; hai là “tin gì thì đọc nấy”. Nếu đọc gì cũng tin, con người sẽ trở thành nô lệ của sách, để cho người khác kiểm soát tư duy của mình. Ngược lại, nếu tin gì thì chỉ đọc những thứ đó, con người sẽ tự khép kín tư duy của mình, khiến bất kỳ tư tưởng mới nào cũng không thể đi vào.
Trong cuộc sống hiện thực, tình trạng “đọc gì thì tin nấy” không phải là hiếm gặp. Điều này có thể dẫn đến hai hậu quả. Một là bị những quan niệm có sẵn chi phối, trở thành tín đồ của những học thuyết sai lầm. Hai là do bản thân không có chính kiến, cảm thấy những điều trong sách đều có lý, nên quan điểm thay đổi liên tục. Khi những quan điểm trong sách mâu thuẫn với nhau, lại càng không biết phải phán đoán thế nào. Vốn dĩ đọc sách là để giải tỏa những điều hoang mang, nhưng cách đọc “đọc gì thì tin nấy” này lại khiến con người càng đọc nhiều càng không những không giải đáp được thắc mắc mà ngược lại càng thêm hoang mang.
Đương nhiên, chúng ta chủ trương đọc nhiều sách, kiến thức nên được mở rộng. Nhưng đọc nhiều sách có một tiền đề, đó là không thể giữ thái độ “đọc gì thì tin nấy”, mà phải lấy việc theo đuổi chân lý làm mục đích. Cần thông qua việc so sánh và phân tích để từng bước hình thành quan điểm đúng đắn của riêng mình. Khi đọc sách cần có chính kiến, từ những cuốn sách đã đọc mà tiếp thu được những điều thực sự hữu ích. Dù đọc không nhiều nhưng vẫn có thu hoạch thì cũng hơn hẳn phương pháp đọc sách khiến bản thân càng đọc càng mơ hồ.
Một điều “kỵ” khác là “tin gì thì đọc nấy”. Có người học chuyên ngành gì thì chỉ đọc sách thuộc lĩnh vực đó. Lấy triết học làm ví dụ, nếu học triết học Marxist mà không đọc một chút sách về triết học Trung Quốc và triết học phương Tây, chỉ đọc vài tác phẩm kinh điển của chủ nghĩa Marx, thì chắc chắn sẽ không thể học tốt. Huống chi có những người còn mang thành kiến về trường phái: người học triết học Trung Quốc thì coi thường triết học Marxist, người học triết học phương Tây lại coi thường triết học Trung Quốc. Với thái độ như vậy, rất khó có được nền tảng học thuật toàn diện.
Nếu việc đọc sách chỉ tập trung vào chuyên ngành của bản thân, không hứng thú với những lĩnh vực khác, thì điều này cũng thể hiện trong mối quan hệ giữa khoa học xã hội và khoa học tự nhiên. Những người làm nghiên cứu khoa học công nghệ và những người nghiên cứu các ngành khoa học nhân văn coi thường lẫn nhau. Trên thực tế, khoa học tự nhiên và khoa học nhân văn là hai phương diện không thể tách rời trong quá trình nhận thức thế giới. Chỉ khi kết hợp văn hóa nhân văn với văn hóa khoa học công nghệ thì con người mới có thể có được tầm nhìn mang tính vĩ mô.`,text:`读书有两“忌”：一“忌”读什么，信什么；另一“忌”是信什么，读什么。如果读什么信什么，就会变成书的奴隶，让自己的头脑任别人控制。相反，信什么读什么，就会把自己的头脑关闭起来，任何新思想都进不去。
在现实生活中，读什么信什么的情况并不少见。这可能产生两种后果：或者是被先人为主的观念控制，变成错误学说的信徒。第二种情况是由于自己没有主见，觉得书中讲的都有道理，观点一日三变。当书中观点彼此矛盾时，更是不知如何判断。读书本来是解除困惑的，而这种读什么就信什么的方式，结果书读多了不仅不能解惑，反而越读越惑。
我们当然主张多读书，知识面应该宽些。可是多读书有个前提，就是不能采取“读什么，信什么”的态度，而应该以追求真理为目的。要通过比较分析，逐渐形成自己的正确观点。读书要有自己的见解，从所读的书中获得真正有用的东西，即使是读的不多也有所得，远胜于那种越读越糊涂的读书方法。
另一个“忌”是信什么，读什么。有的人专业是什么，就读什么方面的书。以哲学为例，如果是学马克思主义哲学的，不读点儿中国哲学、西方哲学的书，只读几本马克思主义经典，肯定学不好。更不用说那些带有门户之见的人，学中国哲学瞧不起马克思主义哲学，学西方哲学又瞧不起中国哲学，这样的态度就难以获得全面的学术修养。
读书如果只关注自己的专业，对别的不感兴趣，在文科与理科的关系问题上也有表现。从事科技研究的人和从事人文学科研究的人相互轻视。实际上，自然科学和人文科学是对世界认识的不可分离的两个方面。只有将人文文化和科技文化彼此结合，才能拥有宏观的视野。`,

patterns:[["如果……，就……","表示条件关系。","Nếu…… thì……","如果读什么信什么，就会变成书的奴隶。"],["相反，……","表示与前面的情况相反。","Ngược lại; trái lại。","相反，信什么读什么，就会把自己的头脑关闭起来。"],["不是……，而是……","表示否定一种情况，提出另一种情况。","Không phải…… mà là……","读书不是为了相信所有观点，而是为了追求真理。"],["或者……或者……","表示两种可能性。","Hoặc…… hoặc……","或者是被先人为主的观念控制。"],["由于……","表示原因。","Do……; bởi vì……","第二种情况是由于自己没有主见。"],["越……越……","表示程度随着变化而变化。","Càng…… càng……","反而越读越惑。"],["即使……也……","表示让步关系。","Cho dù…… cũng……","即使是读的不多也有所得。"],["远胜于……","表示比较，说明明显更好。","Vượt xa……; tốt hơn rất nhiều so với……","远胜于那种越读越糊涂的读书方法。"],["什么……，就……什么……","表示什么是……就做什么。","Là gì thì…… cái đó; cái gì… thì…","专业是什么，就读什么方面的书。"],["不……，只……","表示否定一种做法，只采取另一种做法。","Không…… mà chỉ……","不读点儿中国哲学、西方哲学的书，只读几本马克思主义经典。"],["更不用说……","表示进一步强调。","Huống chi……; càng không cần nói đến……","更不用说那些带有门户之见的人。"],["瞧不起……","表示看不起、轻视。","Coi thường……","学中国哲学瞧不起马克思主义哲学。"],["只有……才……","表示必要条件。","Chỉ khi…… mới……","只有将人文文化和科技文化彼此结合，才能拥有宏观的视野。"],["彼此……","表示双方相互之间。","Lẫn nhau; giữa hai bên。","人文文化和科技文化彼此结合。"],["从……中……","表示从某个范围或过程获得结果。","Từ…… mà……","从所读的书中获得真正有用的东西。"],["即使……也……，远胜于……","表示让步并进行比较。","Dù…… cũng……, vẫn tốt hơn nhiều so với……","即使是读的不多也有所得，远胜于那种越读越糊涂的读书方法。"],["A 是 B 的……","表示A是B的某种方面或组成部分。","A là…… của B。","自然科学和人文科学是对世界认识的不可分离的两个方面。"],["对……来说 / 在……问题上","表示对象或所涉及的问题。","Đối với…… / Về vấn đề……","在文科与理科的关系问题上也有表现。"],["由于……，……","表示原因和结果。","Do…… nên……","由于自己没有主见，觉得书中讲的都有道理。"],["不能……，而应该……","表示否定一种做法，提出应该采取的做法。","Không nên/không thể…… mà nên……","不能采取“读什么，信什么”的态度，而应该以追求真理为目的。"]],

const listenQuiz=[[["汉字是世界上历史最悠久的文字之一。",["Chữ Hán là một trong những loại chữ có lịch sử lâu đời nhất thế giới.","Chữ Hán là loại chữ mới nhất thế giới.","Chữ Hán chỉ xuất hiện gần đây.","Chữ Hán không có lịch sử."],0,"Câu nói nhấn mạnh lịch sử lâu đời của chữ Hán."],["现代汉字的字形中，有一部分是形声字。",["Trong hình dạng chữ Hán hiện đại, có một bộ phận là chữ hình thanh.","Tất cả chữ Hán hiện đại đều là chữ tượng hình.","Không có chữ hình thanh trong tiếng Hán hiện đại.","Chữ hình thanh chỉ tồn tại trong tiếng Anh."],0,"Câu nói giới thiệu một bộ phận chữ hình thanh trong chữ Hán hiện đại."],["所谓形声字，是指由形旁和声旁组成的字。",["Chữ hình thanh là chữ được tạo thành từ bộ phận biểu ý và bộ phận biểu âm.","Chữ hình thanh chỉ có bộ phận biểu ý.","Chữ hình thanh chỉ có bộ phận biểu âm.","Chữ hình thanh không có cấu tạo."],0,"Đây là định nghĩa trực tiếp về 形声字."],["形旁表示字的意义类别，声旁表示字的读音。",["Bộ phận biểu ý chỉ loại nghĩa của chữ, còn bộ phận biểu âm chỉ cách đọc.","Hai bộ phận đều chỉ nghĩa.","Hai bộ phận đều chỉ âm.","Bộ phận biểu ý chỉ cách đọc, bộ phận biểu âm chỉ nghĩa."],0,"Câu này phân biệt chức năng của 形旁 và 声旁."],["比如，“蝴”字的“虫”就是形旁，“胡”就是声旁。",["Ví dụ trong chữ “蝴”, “虫” là bộ phận biểu ý, “胡” là bộ phận biểu âm.","“蝴” không có 形旁.","“胡” là bộ phận biểu ý.","“虫” là bộ phận biểu âm."],0,"Đây là ví dụ về cấu tạo của chữ 蝴."],["了解汉字的形旁，可以帮助我们理解汉字的意义。",["Hiểu bộ phận biểu ý của chữ Hán có thể giúp chúng ta hiểu nghĩa của chữ.","Hiểu 形旁 chỉ giúp viết chữ đẹp.","Hiểu 形旁 có thể thay đổi cách đọc.","Hiểu 形旁 không có tác dụng gì."],0,"形旁 có thể hỗ trợ việc hiểu nghĩa chữ."],["但是，形旁并不总是能够准确地表示字义。",["Tuy nhiên, 形旁 không phải lúc nào cũng có thể biểu thị chính xác nghĩa của chữ.","形旁 luôn luôn biểu thị chính xác nghĩa.","形旁 không bao giờ liên quan đến nghĩa.","形旁 chỉ biểu thị âm đọc."],0,"Tác giả lưu ý rằng tác dụng của 形旁 có giới hạn."],["汉字在长期使用过程中不断形成和演变。",["Trong quá trình sử dụng lâu dài, chữ Hán không ngừng hình thành và biến đổi.","Chữ Hán không bao giờ thay đổi.","Chữ Hán chỉ biến đổi trong một ngày.","Chữ Hán không có quá trình hình thành."],0,"Câu nói nhấn mạnh quá trình hình thành và biến đổi lâu dài."],["同一个形旁在不同的字中，所表示的意义也可能不一致。",["Cùng một 形旁 trong các chữ khác nhau cũng có thể biểu thị ý nghĩa không nhất quán.","Cùng một 形旁 luôn có đúng một nghĩa.","Các chữ khác nhau luôn có cùng nghĩa.","形旁 không bao giờ thay đổi cách biểu nghĩa."],0,"Câu này chỉ ra sự không hoàn toàn nhất quán của 形旁."],["例如，“铜”的形旁“钅”提示它跟金属有关系。",["Ví dụ, 形旁 “钅” trong “铜” gợi ý rằng chữ này liên quan đến kim loại.","“钅” gợi ý chữ “铜” liên quan đến nước.","“钅” chỉ cách phát âm của “铜”.","“钅” không có liên quan gì đến nghĩa."],0,"钅 là bộ phận biểu ý gợi liên quan đến kim loại."],["通过汉字的形旁来猜测词义，是一种有用的方法。",["Thông qua 形旁 của chữ Hán để đoán nghĩa từ là một phương pháp hữu ích.","Không thể dùng 形旁 để đoán nghĩa.","Chỉ có thể dùng âm thanh để đoán nghĩa.","Đoán nghĩa từ không cần dựa vào chữ."],0,"Câu này nêu phương pháp đoán nghĩa dựa vào 形旁."],["尤其是在有语境和上下文提示的情况下，这种方法更有效。",["Đặc biệt khi có ngữ cảnh và gợi ý từ văn cảnh thì phương pháp này hiệu quả hơn.","Có ngữ cảnh thì phương pháp kém hiệu quả hơn.","Phương pháp chỉ dùng được khi không có ngữ cảnh.","Ngữ cảnh không ảnh hưởng đến việc đoán nghĩa."],0,"Ngữ cảnh và上下文 có thể hỗ trợ việc đoán nghĩa."],["我们可以根据形旁猜测字词的意思。",["Chúng ta có thể dựa vào 形旁 để đoán nghĩa của chữ và từ.","Chúng ta phải bỏ qua 形旁.","Chúng ta chỉ có thể đoán cách viết.","Chúng ta không thể suy đoán nghĩa."],0,"Đây là cách ứng dụng trực tiếp của 形旁."],["这种方法不能代替查词典。",["Phương pháp này không thể thay thế việc tra từ điển.","Phương pháp này có thể hoàn toàn thay thế từ điển.","Không cần tra từ điển nữa.","Từ điển không cần thiết khi học chữ Hán."],0,"Đoán nghĩa bằng 形旁 chỉ là phương pháp hỗ trợ."],["形旁有时只能给我们一个大概的方向。",["Đôi khi 形旁 chỉ có thể cho chúng ta một hướng đoán khái quát.","形旁 luôn cho đáp án chính xác.","形旁 không cho bất kỳ gợi ý nào.","形旁 có thể giải thích toàn bộ câu."],0,"形旁 đôi khi chỉ cung cấp hướng suy đoán."],["学习者如果掌握这种方法，就能提高猜词能力。",["Nếu người học nắm được phương pháp này thì có thể nâng cao khả năng đoán từ.","Nếu học phương pháp này thì sẽ quên từ vựng.","Phương pháp này làm giảm khả năng đoán từ.","Phương pháp này chỉ dành cho giáo viên."],0,"Nắm phương pháp có thể giúp tăng khả năng đoán từ."],["了解形旁，可以加深我们对汉字的认识。",["Hiểu 形旁 có thể làm sâu sắc hơn nhận thức của chúng ta về chữ Hán.","Hiểu 形旁 làm giảm hiểu biết về chữ Hán.","Hiểu 形旁 chỉ giúp phát âm.","Hiểu 形旁 không liên quan đến nhận thức."],0,"了解形旁 giúp người học hiểu chữ Hán sâu hơn."],["同时，也能增强自己的猜词能力。",["Đồng thời cũng có thể tăng cường khả năng đoán từ của bản thân.","Đồng thời làm giảm khả năng đoán từ.","Đồng thời khiến việc học từ khó hơn.","Đồng thời thay thế việc đọc."],0,"Câu này nêu thêm một tác dụng của việc hiểu 形旁."],["因此，掌握形旁知识对汉语学习很有帮助。",["Vì vậy, nắm kiến thức về 形旁 rất có ích cho việc học tiếng Hán.","Vì vậy, 形旁 không có ích cho việc học tiếng Hán.","Vì vậy, chỉ cần học phát âm.","Vì vậy, không cần học chữ Hán."],0,"Đây là kết luận về giá trị của kiến thức 形旁."],["因此，掌握形旁知识对汉语学习很有帮助。",["Vì vậy, nắm kiến thức về 形旁 rất có ích cho việc học tiếng Hán.","Vì vậy, không cần học chữ Hán.","Vì vậy, chỉ cần học phát âm.","Vì vậy, 形旁 không có tác dụng."],0,"Đây là kết luận về lợi ích của việc nắm kiến thức 形旁."]],[["汉字的繁体字与简体字之争，百余年来从未中断过。",["Tranh luận về chữ phồn thể và giản thể đã chưa từng gián đoạn trong hơn một trăm năm.","Tranh luận mới bắt đầu gần đây.","Hai loại chữ đã biến mất hơn một trăm năm.","Mọi người đã thống nhất về hai loại chữ."],0,"Câu nói nhấn mạnh tranh luận đã kéo dài hơn một trăm năm."],["只要有中国人的地方，就有不同看法。",["Chỉ cần có người Trung Quốc thì có những quan điểm khác nhau.","Chỉ có ở Trung Quốc mới có người dùng chữ Hán.","Mọi người Trung Quốc đều có cùng quan điểm.","Không có người Trung Quốc nào quan tâm chữ Hán."],0,"Câu này nói rằng ở nơi có người Trung Quốc thường có những cách nhìn khác nhau."],["所有的炎黄子孙，都在关注汉字，也关注汉字代表的中华文化。",["Tất cả con cháu Viêm Hoàng đều quan tâm chữ Hán và nền văn hóa Trung Hoa mà chữ Hán đại diện.","Chỉ học giả mới quan tâm chữ Hán.","Chỉ người nước ngoài quan tâm văn hóa Trung Hoa.","Mọi người không quan tâm đến chữ Hán."],0,"Chữ Hán gắn với sự quan tâm đến văn hóa Trung Hoa."],["文字是一个民族传承文化的主要工具。",["Chữ viết là công cụ chủ yếu để một dân tộc truyền thừa văn hóa.","Chữ viết chỉ dùng để ghi âm.","Chữ viết không liên quan đến văn hóa.","Chữ viết chỉ dùng trong nghệ thuật."],0,"Câu này xác định vai trò của chữ viết trong việc truyền thừa văn hóa."],["汉字的演变史，也始终与五千年的中华民族史密切相关。",["Lịch sử biến đổi của chữ Hán luôn liên quan mật thiết đến lịch sử dân tộc Trung Hoa năm nghìn năm.","Lịch sử chữ Hán hoàn toàn tách khỏi lịch sử Trung Hoa.","Chữ Hán chỉ xuất hiện trong thời hiện đại.","Chữ Hán không có quá trình biến đổi."],0,"Lịch sử biến đổi của chữ Hán gắn chặt với lịch sử dân tộc."],["众所周知，简体字源于历史上人们自行简化的手写体。",["Như mọi người đều biết, chữ giản thể bắt nguồn từ chữ viết tay được người xưa tự giản hóa.","Chữ giản thể hoàn toàn do người hiện đại phát minh.","Chữ giản thể bắt nguồn từ tiếng nước ngoài.","Chữ giản thể không có nguồn gốc lịch sử."],0,"Nguồn gốc được nêu là chữ viết tay tự giản hóa trong lịch sử."],["它是以繁体字为基础的，不能打着传统文化的旗号去否认简体字。",["Nó lấy chữ phồn thể làm cơ sở, không thể nhân danh văn hóa truyền thống để phủ nhận chữ giản thể.","Chữ giản thể không liên quan đến chữ phồn thể.","Có thể dùng văn hóa truyền thống để phủ nhận chữ giản thể.","Chữ phồn thể được tạo ra từ chữ giản thể."],0,"Câu này giải thích quan hệ giữa giản thể và phồn thể."],["在汉字的广泛推广与使用上，简体字功不可没。",["Trong việc phổ biến và sử dụng rộng rãi chữ Hán, chữ giản thể có đóng góp quan trọng.","Chữ giản thể không có tác dụng gì.","Chữ giản thể chỉ dùng trong nghệ thuật.","Chữ giản thể làm gián đoạn việc sử dụng chữ Hán."],0,"“功不可没” nhấn mạnh đóng góp quan trọng."],["中国大陆推广简体字五十多年来，文盲的比例越来越小。",["Sau hơn năm mươi năm phổ biến chữ giản thể ở Trung Quốc đại lục, tỷ lệ người mù chữ ngày càng nhỏ.","Tỷ lệ người mù chữ ngày càng tăng.","Chữ giản thể làm giảm số người học chữ.","Việc phổ biến chữ giản thể chỉ kéo dài vài năm."],0,"Câu nói nêu sự thay đổi về tỷ lệ người mù chữ."],["外国人学汉字也从简体字中受益匪浅。",["Người nước ngoài học chữ Hán cũng được hưởng lợi nhiều từ chữ giản thể.","Người nước ngoài không thể học chữ giản thể.","Chỉ người Trung Quốc được hưởng lợi.","Chữ giản thể không giúp ích cho người học."],0,"Người học nước ngoài cũng hưởng lợi đáng kể từ giản thể."],["平心而论，繁体字、简体字都是汉字的继承与发展。",["Công bằng mà nói, chữ phồn thể và giản thể đều là sự kế thừa và phát triển của chữ Hán.","Chỉ phồn thể mới là chữ Hán đúng.","Chỉ giản thể mới có giá trị.","Hai loại chữ hoàn toàn đối lập."],0,"Tác giả nhìn nhận cả hai đều thuộc quá trình kế thừa và phát triển."],["没有继承谈何发展？",["Không có kế thừa thì nói gì đến phát triển?","Không có phát triển thì không cần kế thừa.","Kế thừa và phát triển không liên quan.","Chỉ cần phát triển, không cần kế thừa."],0,"Đây là câu hỏi tu từ nhấn mạnh vai trò của kế thừa."],["简体字、繁体字完全可以并行不悖。",["Chữ giản thể và phồn thể hoàn toàn có thể cùng tồn tại mà không mâu thuẫn.","Hai loại chữ không thể cùng tồn tại.","Chỉ có thể sử dụng phồn thể.","Chỉ có thể sử dụng giản thể."],0,"“并行不悖” nghĩa là cùng tồn tại mà không xung đột."],["繁体字用于书写特别是用于艺术类的创作，那种中华文化的传统韵味妙不可言。",["Phồn thể khi dùng cho sáng tác nghệ thuật thể hiện nét phong vị truyền thống Trung Hoa khó diễn tả bằng lời.","Phồn thể chỉ dùng trong giao thông.","Phồn thể không có giá trị nghệ thuật.","Phồn thể làm mất đi phong vị truyền thống."],0,"Tác giả nhấn mạnh nét phong vị truyền thống của phồn thể trong nghệ thuật."],["而简体字，无论读、认、书写皆好学、好记，书写效率高。",["Còn chữ giản thể, dù đọc, nhận hay viết đều dễ học, dễ nhớ và có hiệu suất viết cao.","Chữ giản thể khó học và khó nhớ.","Chữ giản thể chỉ phù hợp với nghệ thuật.","Chữ giản thể viết chậm hơn phồn thể."],0,"Đây là ưu điểm về tính dễ học và hiệu suất viết của giản thể."],["简体字平均笔画至少比繁体字少了三分之一以上。",["Số nét trung bình của chữ giản thể ít hơn chữ phồn thể ít nhất trên một phần ba.","Số nét giản thể nhiều hơn phồn thể một phần ba.","Hai loại chữ có số nét bằng nhau.","Chỉ một vài chữ giản thể ít nét hơn."],0,"Câu này đưa ra số liệu so sánh số nét."],["汉字书写是否美观并不在于繁与简，而要靠自家的艺术功底。",["Chữ Hán viết đẹp hay không không nằm ở phồn hay giản mà phụ thuộc vào nền tảng nghệ thuật của người viết.","Chỉ chữ phồn thể mới đẹp.","Chỉ chữ giản thể mới đẹp.","Vẻ đẹp của chữ chỉ phụ thuộc vào số nét."],0,"Tác giả cho rằng năng lực nghệ thuật của người viết mới là yếu tố quan trọng."],["繁体字、简体字各有千秋。",["Chữ phồn thể và giản thể mỗi loại đều có nét đặc sắc riêng.","Chỉ phồn thể có ưu điểm.","Chỉ giản thể có ưu điểm.","Hai loại chữ hoàn toàn giống nhau."],0,"“各有千秋” nghĩa là mỗi bên có ưu điểm riêng."],["“识繁书简”将会成为海峡两岸乃至全球汉字使用者最容易取得一致的观点。",["“Biết nhận phồn thể, viết giản thể” có thể trở thành quan điểm dễ đạt đồng thuận giữa người dùng chữ Hán trên toàn cầu.","Mọi người sẽ chỉ viết phồn thể.","Mọi người sẽ bỏ chữ giản thể.","Quan điểm này chỉ áp dụng cho một vùng nhỏ."],0,"Câu cuối mở rộng phạm vi đến người sử dụng chữ Hán trên toàn cầu."],["让各地的各种正规出版物依惯例，各得其所，体现了“和而不同”的思想。",["Để các ấn phẩm chính quy ở các nơi theo thông lệ, mỗi loại có vị trí phù hợp, thể hiện tư tưởng hòa hợp mà vẫn khác biệt.","Để tất cả ấn phẩm chỉ dùng phồn thể.","Để tất cả ấn phẩm chỉ dùng giản thể.","Để các ấn phẩm không được sử dụng theo thông lệ."],0,"“各得其所” nhấn mạnh mỗi loại có vị trí và cách sử dụng phù hợp."]],[["读书有两“忌”：一“忌”读什么，信什么；另一“忌”是信什么，读什么。",["Đọc sách có hai điều cần tránh.","Đọc sách càng nhiều càng tốt.","Chỉ nên đọc sách chuyên ngành.","Không cần suy nghĩ khi đọc sách."],0,"Câu này nói rằng đọc sách có hai điều cần tránh."],["如果读什么信什么，就会变成书的奴隶，让自己的头脑任别人控制。",["Nếu đọc gì cũng tin thì sẽ trở thành nô lệ của sách.","Nếu đọc gì cũng hiểu thì sẽ học rất nhanh.","Nếu không đọc sách thì sẽ mất kiến thức.","Nếu chỉ đọc sách chuyên ngành thì sẽ thành công."],0,"Đọc gì cũng tin sẽ khiến tư duy bị người khác chi phối."],["相反，信什么读什么，就会把自己的头脑关闭起来，任何新思想都进不去。",["Ngược lại, tin gì thì chỉ đọc cái đó sẽ đóng kín tư duy.","Ngược lại, đọc càng nhiều thì càng hiểu biết.","Ngược lại, đọc sách giúp mở rộng tư duy.","Ngược lại, chỉ cần tin vào bản thân là đủ."],0,"Tác giả cho rằng cách đọc theo niềm tin có sẵn có thể làm tư duy khép kín."],["在现实生活中，读什么信什么的情况并不少见。",["Trong cuộc sống thực tế, tình trạng đọc gì tin nấy không hiếm.","Trong cuộc sống thực tế, mọi người đều không đọc sách.","Trong cuộc sống thực tế, ai cũng thay đổi nghề nghiệp.","Trong cuộc sống thực tế, sách không còn quan trọng."],0,"Câu nói cho biết hiện tượng đọc gì tin nấy vẫn khá phổ biến."],["这可能产生两种后果：或者是被先人为主的观念控制，变成错误学说的信徒。",["Điều này có thể dẫn đến hai hậu quả: bị quan niệm có sẵn chi phối và trở thành người tin theo học thuyết sai.","Điều này khiến mọi người đọc được nhiều sách hơn.","Điều này giúp hình thành chính kiến ngay lập tức.","Điều này làm cho mọi học thuyết đều đúng."],0,"Một hậu quả là bị quan niệm có sẵn chi phối và tin theo học thuyết sai."],["第二种情况是由于自己没有主见，觉得书中讲的都有道理，观点一日三变。",["Trường hợp thứ hai là do bản thân không có chính kiến, cho rằng điều gì trong sách cũng có lý nên quan điểm thay đổi liên tục.","Trường hợp thứ hai là đọc quá ít sách.","Trường hợp thứ hai là chỉ tin vào học thuyết cũ.","Trường hợp thứ hai là luôn giữ nguyên một quan điểm."],0,"Không có chính kiến khiến quan điểm thay đổi liên tục."],["当书中观点彼此矛盾时，更是不知如何判断。",["Khi các quan điểm trong sách mâu thuẫn với nhau thì càng không biết phán đoán thế nào.","Khi sách dài thì càng dễ hiểu.","Khi các quan điểm giống nhau thì khó đọc.","Khi đọc sách thì không cần phán đoán."],0,"Khi các quan điểm mâu thuẫn, người đọc càng khó phán đoán."],["读书本来是解除困惑的，而这种读什么就信什么的方式，结果书读多了不仅不能解惑，反而越读越惑。",["Đọc sách vốn để giải tỏa nghi hoặc, nhưng đọc gì tin nấy lại khiến càng đọc càng hoang mang.","Đọc sách luôn làm cho mọi người hết hoang mang.","Đọc càng nhiều thì chắc chắn càng đúng.","Đọc sách chỉ nhằm ghi nhớ từ vựng."],0,"Cách đọc thiếu suy xét có thể khiến người đọc càng đọc càng hoang mang."],["我们当然主张多读书，知识面应该宽些。",["Tất nhiên chúng ta chủ trương đọc nhiều sách, phạm vi kiến thức nên rộng hơn.","Chúng ta không nên đọc nhiều sách.","Chỉ nên đọc một loại sách.","Kiến thức càng hẹp càng tốt."],0,"Tác giả ủng hộ việc đọc nhiều và mở rộng kiến thức."],["可是多读书有个前提，就是不能采取“读什么，信什么”的态度。",["Nhưng đọc nhiều sách có một tiền đề: không được có thái độ đọc gì tin nấy.","Nhưng đọc nhiều sách có nghĩa là phải tin mọi điều.","Nhưng chỉ cần đọc sách chuyên ngành.","Nhưng không cần suy nghĩ khi đọc."],0,"Điều kiện của việc đọc nhiều là không mù quáng tin mọi điều."],["而应该以追求真理为目的。",["Mà nên lấy việc theo đuổi chân lý làm mục đích.","Mà nên lấy việc ghi nhớ từ vựng làm mục đích.","Mà nên lấy việc đọc thật nhanh làm mục đích.","Mà nên lấy việc tranh luận với người khác làm mục đích."],0,"Mục đích đúng của việc đọc là theo đuổi chân lý."],["要通过比较分析，逐渐形成自己的正确观点。",["Cần thông qua so sánh và phân tích để dần hình thành quan điểm đúng của mình.","Cần đọc một cuốn sách duy nhất để hình thành quan điểm.","Cần tin ngay vào ý kiến đầu tiên.","Cần tránh phân tích các quan điểm khác nhau."],0,"Tác giả đề xuất so sánh và phân tích để hình thành quan điểm."],["读书要有自己的见解，从所读的书中获得真正有用的东西。",["Đọc sách cần có kiến giải của riêng mình và thu được những điều thực sự hữu ích từ sách.","Đọc sách chỉ cần ghi nhớ nguyên văn.","Đọc sách không cần có quan điểm riêng.","Đọc sách chỉ để giải trí."],0,"Người đọc cần có kiến giải riêng và biết chọn điều hữu ích."],["即使是读的不多也有所得，远胜于那种越读越糊涂的读书方法。",["Dù đọc không nhiều nhưng có thu hoạch vẫn tốt hơn nhiều so với cách đọc càng đọc càng rối.","Chỉ đọc nhiều mới có thu hoạch.","Đọc càng nhiều chắc chắn càng tốt.","Đọc ít thì hoàn toàn không có giá trị."],0,"Chất lượng và thu hoạch quan trọng hơn việc đọc thật nhiều."],["有的人专业是什么，就读什么方面的书。",["Có người chuyên ngành là gì thì chỉ đọc sách về lĩnh vực đó.","Có người không bao giờ đọc sách.","Có người đọc mọi loại sách như nhau.","Có người chỉ đọc sách văn học."],0,"Câu này nói về việc chỉ đọc sách thuộc chuyên ngành của mình."],["如果是学马克思主义哲学的，不读点儿中国哲学、西方哲学的书，只读几本马克思主义经典，肯定学不好。",["Nếu học triết học Mác mà không đọc thêm triết học Trung Quốc và phương Tây, chỉ đọc vài tác phẩm kinh điển Mác thì chắc chắn khó học tốt.","Nếu học triết học thì chỉ nên đọc một loại sách.","Nếu học triết học thì không cần đọc tác phẩm kinh điển.","Nếu học triết học phương Tây thì không cần biết triết học Trung Quốc."],0,"Tác giả nhấn mạnh cần mở rộng việc đọc sang các hệ thống triết học khác."],["更不用说那些带有门户之见的人。",["Huống chi là những người mang quan điểm thiên lệch.","Không cần nói đến những người đọc nhiều sách.","Đặc biệt là những người không có chuyên môn.","Những người này đều có kiến thức toàn diện."],0,"“更不用说” dùng để nhấn mạnh thêm một trường hợp."],["这样的态度就难以获得全面的学术修养。",["Thái độ như vậy khó có được sự tu dưỡng học thuật toàn diện.","Thái độ như vậy giúp học thuật phát triển toàn diện.","Thái độ như vậy giúp tránh mọi mâu thuẫn.","Thái độ như vậy khiến việc đọc sách dễ hơn."],0,"Chỉ coi thường các lĩnh vực khác sẽ khó có tu dưỡng học thuật toàn diện."],["只有将人文文化和科技文化彼此结合，才能拥有宏观的视野。",["Chỉ khi kết hợp văn hóa nhân văn và văn hóa khoa học kỹ thuật với nhau mới có thể có tầm nhìn vĩ mô.","Chỉ cần học khoa học kỹ thuật là có tầm nhìn vĩ mô.","Chỉ cần học nhân văn là đủ.","Không cần kết hợp các lĩnh vực văn hóa."],0,"Tác giả cho rằng cần kết hợp hai lĩnh vực để có tầm nhìn rộng."],["读书如果只关注自己的专业，对别的不感兴趣，在文科与理科的关系问题上也有表现。",["Nếu chỉ chú ý đến chuyên ngành của mình mà không hứng thú với lĩnh vực khác, điều đó cũng thể hiện trong quan hệ giữa khoa học xã hội và tự nhiên.","Nếu chỉ học khoa học tự nhiên thì sẽ thành công.","Chuyên ngành quyết định mọi sở thích đọc sách.","Không cần quan tâm đến các lĩnh vực khác."],0,"Câu này mở rộng vấn đề đọc quá hẹp sang quan hệ giữa các lĩnh vực học thuật."]]];
const readQuiz=[[["汉字中有一部分是形声字。所谓形声字，是指由形旁和声旁组成的字。形旁表示字的意义类别，声旁表示字的读音。","什么是形声字？",["由形旁和声旁组成的字","只有形旁组成的字","只有声旁组成的字","没有任何结构的字"],0,"文章直接把形声字定义为由形旁和声旁组成的字。"],["形旁表示字的意义类别，声旁表示字的读音。比如，“蝴”字的“虫”就是形旁，“胡”就是声旁。这个例子说明两个部分具有不同作用。","“蝴”字中“虫”的作用是什么？",["表示读音","表示意义类别","表示词性","表示语法"],1,"“虫”是形旁，用来提示意义类别。"],["了解汉字的形旁，可以帮助我们理解汉字的意义。但是，形旁并不总是能够准确地表示字义。因此，学习者还需要结合语境。","为什么不能完全依靠形旁判断字义？",["因为形旁从来没有意义","因为形旁不总能准确表示字义","因为汉字没有结构","因为语境没有作用"],1,"文章明确指出形旁有一定局限。"],["汉字在长期使用过程中不断形成和演变。同一个形旁在不同的字中，所表示的意义也可能不一致。","同一个形旁在不同字中有什么特点？",["意义一定完全相同","可能表示不一致的意义","一定表示读音","一定没有意义"],1,"文章强调同一形旁的意义可能并不完全一致。"],["例如，“铜”的形旁“钅”提示它跟金属有关系。这个提示可以帮助学习者猜测“铜”的意义。","“钅”在“铜”中提示什么？",["与金属有关","与水有关","与植物有关","与声音有关"],0,"钅是金属类形旁。"],["通过汉字的形旁来猜测词义，是一种有用的方法。尤其是在有语境和上下文提示的情况下，这种方法更有效。","什么时候利用形旁猜词更有效？",["没有语境时","有语境和上下文提示时","完全不看上下文时","只听发音时"],1,"文章明确说有语境和上下文提示时更有效。"],["我们可以根据形旁猜测字词的意思。这种方法能够帮助学习者在遇到生词时进行初步判断。","根据文章，形旁的主要用途之一是什么？",["猜测字词的意思","改变字的读音","删除汉字","翻译整篇文章"],0,"形旁可以帮助学习者初步猜测字词意义。"],["这种方法不能代替查词典。形旁有时只能给我们一个大概的方向。遇到重要或不确定的词语时，还应该查词典确认。","形旁猜词有什么局限？",["完全准确","只能提供大概方向，不能代替词典","没有任何帮助","只能用于写作"],1,"文章强调形旁只能提供方向。"],["学习者如果掌握这种方法，就能提高猜词能力。了解形旁，可以加深我们对汉字的认识。同时，也能增强自己的猜词能力。","掌握形旁知识有什么好处？",["降低猜词能力","提高对汉字的认识和猜词能力","减少词汇量","只提高书写速度"],1,"文章列出加深认识和增强猜词能力两个作用。"],["形旁有时只能给我们一个大概的方向，但这仍然对阅读有帮助。特别是在遇到不熟悉的词语时，学习者可以先进行推测。","遇到不熟悉的词语时，学习者可以怎样做？",["立即放弃","根据形旁先进行推测","只看词典不看文章","改变词语"],1,"先利用形旁进行合理推测是文章介绍的方法。"],["“蝴”字的“虫”是形旁，“胡”是声旁。通过这个例子可以看出，形声字的两个部分分别承担不同功能。","“胡”在“蝴”字中是什么？",["形旁","声旁","部首之外的标点","词尾"],1,"“胡”是声旁，主要提示读音。"],["形旁表示字的意义类别，声旁表示字的读音。这种结构使学习者有机会从字形中获得一些信息。","从形旁和声旁中，哪一个主要提示读音？",["形旁","声旁","两个都只提示意义","两个都不提示读音"],1,"声旁主要提示读音。"],["同一个形旁在不同的字中，所表示的意义也可能不一致。因此，猜词时不能只看一个部件，还要结合上下文。","猜词时除了形旁还应该注意什么？",["上下文","字体颜色","页面大小","文章长度"],0,"文章强调结合语境和上下文。"],["尤其是在有语境和上下文提示的情况下，这种方法更有效。也就是说，字形信息和语境信息可以互相帮助。","“这种方法”指什么？",["通过形旁猜测词义","背诵整篇文章","只听录音","修改汉字"],0,"指根据形旁来猜测词义的方法。"],["了解汉字的形旁，可以加深我们对汉字的认识，增强自己的猜词能力。因此，形旁知识对汉语学习者有一定价值。","作者对形旁知识的态度是什么？",["认为完全没有价值","认为有一定学习价值","认为应该避免学习","认为只适合书法家"],1,"作者肯定形旁知识对学习汉语的帮助。"],["通过汉字的形旁来猜测词义，是一种有用的方法。但是这种方法不能代替查词典。","这两句话之间是什么关系？",["先肯定作用，再说明局限","完全否定形旁","只介绍词典","两句话没有关系"],0,"作者既肯定方法有用，也提醒其局限。"],["现代汉字中有很多形声字。学习者如果了解形旁和声旁的基本作用，就能更好地理解字形信息。","了解形旁和声旁主要有什么帮助？",["理解字形提供的信息","完全掌握所有词义","不用学习拼音","不用查词典"],0,"了解两者作用有助于利用字形信息。"],["当学习者遇到一个陌生汉字时，可以先观察它的形旁，再结合上下文猜测意思。如果仍然不确定，再查词典。","根据这段话，正确的学习步骤是什么？",["先查词典，再观察上下文","先观察形旁并结合上下文，再查词典确认","直接猜，不需要确认","只看声旁"],1,"这是文章方法的完整应用步骤。"],["形旁能够提供意义类别方面的信息，声旁能够提供读音方面的信息。两者结合可以帮助学习者理解形声字。","形旁和声旁分别主要提供什么信息？",["意义类别和读音","读音和意义类别","词性和语法","翻译和写作"],0,"这是形声字结构中两个部分的基本作用。"],["全文介绍了形声字的基本结构，并说明如何利用形旁猜测字词意义。同时，作者提醒学习者要结合语境，并在必要时查词典。","下列哪项最符合全文主旨？",["形旁可以提供猜词线索，但要结合语境并适当查词典","只要知道形旁就能认识所有汉字","声旁完全没有作用","学习汉字不需要查词典"],0,"全文核心是利用形旁辅助猜词，同时注意方法的局限。"]],[["汉字的繁体字与简体字之争，百余年来从未中断过。近年来这种讨论好像更热闹起来。只要有中国人的地方，就有不同看法。这说明人们一直关注汉字及其文化意义。","这段话主要说明什么？",["人们一直关注繁简字问题","繁体字已经消失","简体字没有人使用","汉字不再重要"],0,"开头强调繁简字争论持续存在以及人们对汉字的关注。"],["文字是一个民族传承文化的主要工具。汉字的演变史始终与中华民族史密切相关。简体字源于历史上人们自行简化的手写体。它是以繁体字为基础的。","简体字的来源是什么？",["完全由现代人创造","源于历史上的简化手写体","源于外国文字","与繁体字没有关系"],1,"文章明确说明简体字源于历史上自行简化的手写体。"],["在汉字的广泛推广与使用上，简体字功不可没。中国大陆推广简体字五十多年来，文盲的比例越来越小。外国人学汉字也从简体字中受益匪浅。","作者认为简体字有什么作用？",["阻碍汉字推广","对汉字推广和学习有重要贡献","只适合艺术创作","不能帮助外国人学习"],1,"文章肯定简体字在推广和学习方面的作用。"],["平心而论，繁体字、简体字都是汉字的继承与发展。没有继承谈何发展？简体字、繁体字完全可以并行不悖。","作者对繁体字和简体字的基本态度是什么？",["只能选择一种","两者不能共存","两者都属于汉字的发展，可以共存","只支持繁体字"],2,"作者认为两者都可以存在和发展。"],["繁体字用于书写特别是用于艺术类的创作，那种中华文化的传统韵味妙不可言。而简体字无论读、认、书写皆好学、好记，书写效率高。","文中认为繁体字的优势主要是什么？",["书写速度最快","具有传统文化的艺术韵味","最容易学习","笔画最少"],1,"繁体字在艺术创作方面具有传统文化韵味。"],["简体字无论读、认、书写皆好学、好记，书写效率高。通过统计发现，简体字平均笔画至少比繁体字少了三分之一以上。","简体字的一个重要特点是什么？",["笔画更多","难学难记","容易学习和书写效率高","只能用于艺术"],2,"文章列出简体字易学易记、效率高等特点。"],["汉字书写是否美观并不在于繁与简，而要靠自家的艺术功底。一些硬笔书法字帖写的是简体字，但同样工整秀丽，很有欣赏价值。","汉字写得美观主要取决于什么？",["繁体还是简体","字的笔画数量","书写者的艺术功底","使用哪种字帖"],2,"作者认为美观主要取决于艺术功底。"],["繁体字、简体字各有千秋。针对它们的不同意见，各种争论，我认为都应该停止。在这个问题上，不要有政治化倾向。","“各有千秋”说明什么？",["只有一种字体有优点","两种字体各有特点","两种字体完全一样","两种字体都没有优点"],1,"“各有千秋”表示各自都有优点和特点。"],["一些有影响的政界、学界人士倡导“识繁书简”，也就是能够认识繁体字，但书写还是用简体字。我颇有同感。这是个好主意！","“识繁书简”是什么意思？",["只认识简体字","认识繁体字，书写使用简体字","只书写繁体字","同时废除两种字体"],1,"文章直接解释了“识繁书简”。"],["它跳出了非此即彼的观点，没有走极端。它倡导习惯于繁体字的，尽可能做到能认、能读、能写简体字。","“非此即彼”在这里指什么？",["认为两种字体都可以使用","认为只能选择其中一种","提倡同时学习两种字体","反对学习简体字"],1,"指非黑即白地只能选择一种。"],["习惯于简体字的，尽可能做到能认、能读繁体字。让各地的各种正规出版物依惯例，各得其所，体现了“和而不同”的思想。","“各得其所”在文中是什么意思？",["各自处在合适的位置","完全统一","互相否定","停止出版"],0,"指不同事物各自处于合适的位置。"],["“识繁书简”将会成为海峡两岸乃至全球汉字使用者最容易取得一致的观点。这个建议试图减少繁简字之间的对立。","“识繁书简”希望达到什么效果？",["加剧繁简字争论","帮助不同使用者更容易取得一致","取消简体字","只推广繁体字"],1,"其目的之一是减少对立、增加共识。"],["汉字的演变史始终与五千年的中华民族史密切相关。文字不仅是交流工具，也是传承文化的重要工具。","为什么作者重视汉字？",["因为汉字只用于考试","因为汉字与文化传承密切相关","因为汉字最容易学习","因为汉字没有变化"],1,"文章把汉字与民族文化传承联系起来。"],["简体字源于历史上人们自行简化的手写体。它是以繁体字为基础的。因此，作者认为不能打着传统文化的旗号去否认简体字。","作者为什么反对以传统文化为名否认简体字？",["因为简体字完全没有历史","因为简体字本身也是历史发展的一部分","因为繁体字不存在","因为两者没有关系"],1,"文章认为简体字同样具有历史发展基础。"],["中国大陆推广简体字五十多年来，文盲的比例越来越小。外国人学汉字也从简体字中受益匪浅。","这两句话主要用来说明什么？",["简体字没有作用","简体字在推广和学习方面有积极作用","外国人不喜欢汉字","文盲数量没有变化"],1,"两个例子都用于说明简体字的实际作用。"],["繁体字用于艺术类创作时，可以体现传统文化的韵味。简体字则好学、好记，书写效率高。","这段话怎样评价繁体字和简体字？",["只肯定繁体字","只肯定简体字","分别指出两者不同的优点","认为两者没有区别"],2,"作者分别说明两种字体的优势。"],["一些硬笔书法字帖写的是简体字，但同样工整秀丽，很有欣赏价值。这说明字体的繁简并不是决定美观的唯一因素。","这个例子说明什么？",["简体字不能用于书法","简体字也可以写得美观","繁体字一定比简体字漂亮","书法不需要技巧"],1,"例子证明简体字同样可以具有艺术价值。"],["作者认为繁体字、简体字完全可以并行不悖。不同的人可以根据不同场合使用不同字体。","作者主张怎样处理繁简字关系？",["互相排斥","只保留一种","允许两者并存并各有适用场合","停止使用汉字"],2,"核心是共存、各得其所。"],["文章最后提出“识繁书简”。这一做法既照顾了繁体字使用者，也照顾了简体字使用者。它没有走极端。","为什么作者赞同“识繁书简”？",["因为它要求所有人只写繁体字","因为它试图兼顾不同使用习惯","因为它取消了简体字","因为它禁止认识繁体字"],1,"这一方案兼顾不同使用习惯，避免极端。"],["全文先讨论繁简字争论，再说明两种字体各自的特点，最后提出“识繁书简”的建议。","下列哪项最符合全文主旨？",["繁体字一定优于简体字","简体字一定优于繁体字","繁简字各有特点，应减少对立、寻求共识","应该停止使用汉字"],2,"全文核心是客观看待两种字体并寻求共识。"]],[["读书有两“忌”：一“忌”读什么，信什么；另一“忌”是信什么，读什么。如果读什么信什么，就会变成书的奴隶，让自己的头脑任别人控制。相反，信什么读什么，就会把自己的头脑关闭起来，任何新思想都进不去。","作者认为读书最需要避免什么？",["盲目相信书中的一切","阅读数量太少","只读文学作品","学习新的思想"],0,"文章强调要避免“读什么，信什么”和“信什么，读什么”。"],["在现实生活中，读什么信什么的情况并不少见。这可能产生两种后果：或者是被先人为主的观念控制，变成错误学说的信徒。第二种情况是由于自己没有主见，觉得书中讲的都有道理，观点一日三变。","读什么信什么可能导致什么？",["形成稳定的判断力","被先入观念控制或缺乏主见","获得全面的学术修养","更容易理解新思想"],1,"文章列举了这种读书方式可能产生的两种后果。"],["当书中观点彼此矛盾时，更是不知如何判断。读书本来是解除困惑的，而这种读什么就信什么的方式，结果书读多了不仅不能解惑，反而越读越惑。我们当然主张多读书，知识面应该宽些。","为什么读书越多反而可能越困惑？",["因为书太少","因为完全不做比较和判断","因为知识面太宽","因为读书速度太快"],1,"文章指出盲目相信不同观点会导致无法判断。"],["可是多读书有个前提，就是不能采取“读什么，信什么”的态度，而应该以追求真理为目的。要通过比较分析，逐渐形成自己的正确观点。读书要有自己的见解，从所读的书中获得真正有用的东西。","作者认为多读书应该以什么为目的？",["追求真理","追求数量","追求速度","追求别人认可"],0,"作者明确提出读书应以追求真理为目的。"],["即使是读的不多也有所得，远胜于那种越读越糊涂的读书方法。另一个“忌”是信什么，读什么。有的人专业是什么，就读什么方面的书。以哲学为例，如果是学马克思主义哲学的，不读点儿中国哲学、西方哲学的书，只读几本马克思主义经典，肯定学不好。","作者为什么不赞成只读本专业的书？",["因为专业书太难","因为这样会限制知识范围","因为专业书没有价值","因为哲学不需要阅读"],1,"文章主张扩大阅读范围，避免知识过于单一。"],["更不用说那些带有门户之见的人，学中国哲学瞧不起马克思主义哲学，学西方哲学又瞧不起中国哲学。这样的态度就难以获得全面的学术修养。读书如果只关注自己的专业，对别的不感兴趣，在文科与理科的关系问题上也有表现。","“门户之见”在文中主要指什么？",["全面看待不同学科","对其他学派或领域有偏见","喜欢阅读各种书籍","重视自己的专业"],1,"“门户之见”表现为轻视其他学派或领域。"],["读书如果只关注自己的专业，对别的不感兴趣，在文科与理科的关系问题上也有表现。从事科技研究的人和从事人文学科研究的人相互轻视。实际上，自然科学和人文科学是对世界认识的不可分离的两个方面。","作者对文科和理科的关系持什么态度？",["认为两者互不相关","认为两者应该相互轻视","认为两者都是认识世界的重要方面","认为只需要学习理科"],2,"作者认为自然科学和人文科学不可分离。"],["实际上，自然科学和人文科学是对世界认识的不可分离的两个方面。只有将人文文化和科技文化彼此结合，才能拥有宏观的视野。读书也应该突破专业限制。这样才能获得更全面的认识。","怎样才能拥有宏观的视野？",["只学习自己的专业","只阅读文学作品","将人文文化和科技文化结合","停止阅读专业书"],2,"文章明确提出两种文化需要彼此结合。"],["我们当然主张多读书，知识面应该宽些。可是多读书有个前提，就是不能采取“读什么，信什么”的态度。要通过比较分析，逐渐形成自己的正确观点。","“知识面应该宽些”说明什么？",["阅读范围应该适当扩大","只能阅读一本书","不需要分析观点","应该相信所有书籍"],0,"作者主张扩大知识面，同时保持独立判断。"],["读书要有自己的见解，从所读的书中获得真正有用的东西。即使是读的不多也有所得，远胜于那种越读越糊涂的读书方法。可见，阅读质量比盲目追求数量更重要。","作者更看重什么？",["阅读速度","阅读数量","独立思考和实际收获","书籍价格"],2,"文章强调自己的见解和真正有用的收获。"],["有的人专业是什么，就读什么方面的书。以哲学为例，只读几本马克思主义经典，肯定学不好。因为不同哲学传统之间可以相互补充。","这个例子主要说明什么？",["专业书没有价值","学习一个领域也需要接触其他相关领域","哲学只有一种传统","马克思主义哲学不值得学习"],1,"作者用哲学学习说明阅读不能过于狭窄。"],["当书中观点彼此矛盾时，更是不知如何判断。读书本来是解除困惑的。可是盲目接受所有观点，反而会增加困惑。因此，阅读需要比较和分析。","面对书中矛盾观点，读者应该怎样做？",["全部接受","完全拒绝阅读","进行比较和分析","只相信第一种观点"],2,"文章建议通过比较分析形成正确观点。"],["读书有两个“忌”。一个是读什么信什么，另一个是信什么读什么。前者容易使人失去独立判断，后者容易限制阅读范围。","这两个“忌”分别有什么问题？",["前者导致盲信，后者限制阅读","前者扩大知识，后者提高判断","两者都能形成正确观点","两者都能扩大阅读范围"],0,"两个问题分别对应盲目相信和阅读范围狭窄。"],["读书本来是解除困惑的，而这种读什么就信什么的方式，结果书读多了不仅不能解惑，反而越读越惑。作者因此强调独立思考的重要性。","作者举这个例子主要想说明什么？",["读书越多越不好","盲目阅读和相信会增加困惑","书本没有知识","读书不能解决问题"],1,"重点是说明盲目信书会使人更加困惑。"],["有的人只读自己专业方面的书，对别的不感兴趣。这样虽然可以深入一个领域，却容易缺少全面的视野。作者建议读者适当扩大阅读范围。","只读专业书可能有什么问题？",["完全不能深入专业","容易缺少全面视野","一定会读不懂专业书","会失去阅读兴趣"],1,"文章担心知识面过窄。"],["从事科技研究的人和从事人文学科研究的人相互轻视。实际上，自然科学和人文科学是对世界认识的不可分离的两个方面。","作者反对哪种现象？",["不同学科之间相互学习","科技与人文结合","不同学科之间相互轻视","扩大阅读范围"],2,"作者明确反对学科之间相互轻视。"],["只有将人文文化和科技文化彼此结合，才能拥有宏观的视野。这里强调的是不同知识领域之间的联系。","“彼此结合”在文中的意思是什么？",["互相分离","互相结合","互相否定","互相替代"],1,"指人文文化与科技文化相互结合。"],["作者认为，即使读书不多，只要能有所收获，也比越读越糊涂好。由此可见，读书并不是单纯追求数量。","根据文章，可以得出什么结论？",["读书越多越好","读书只看数量","读书应该重视质量和收获","读书没有必要"],2,"文章强调有真正收获比盲目追求数量更重要。"],["全文围绕读书方法展开讨论。作者既主张多读书，也强调独立思考。最后又指出不同知识领域应该相互结合。","下列哪项最符合全文主旨？",["读书应该少而精","读书要广泛、独立思考并突破专业限制","只读专业书最有效","书中的观点都应该相信"],1,"全文核心是广泛阅读、独立判断和跨领域学习。"],["阅读不仅要有数量，还要有质量。作者主张多读书，但反对“读什么，信什么”。读者应该比较不同观点，逐渐形成自己的见解。","根据这段话，怎样的阅读方式更符合作者观点？",["盲目接受所有观点","广泛阅读并独立思考","只读自己喜欢的书","只追求阅读数量"],1,"作者主张多读书，同时进行比较、分析并形成自己的见解。"]]];
let data=JSON.parse(localStorage.getItem("hanYuSpace")||'{"xp":0,"streak":0,"correct":0,"attempts":0,"dark":false}');
let lesson=0,flash=0,revealed=false,qIndex=0,fillIndex=0,readIndex=0,patternIndex=0;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("hanYuSpace",JSON.stringify(data));updateStats()}
function updateStats(){let lv=Math.floor(data.xp/100)+1,p=data.xp%100;document.querySelectorAll("[data-level]").forEach(x=>x.textContent=lv);document.querySelectorAll("[data-xp]").forEach(x=>x.textContent=data.xp);document.querySelectorAll("[data-streak]").forEach(x=>x.textContent=data.streak);if($("sideProg"))$("sideProg").style.width=p+"%"}
function stats(){return `<div class="stats"><div class="card stat">⭐ <b data-level>${Math.floor(data.xp/100)+1}</b><small>等级</small></div><div class="card stat">⚡ <b data-xp>${data.xp}</b><small>经验值 XP</small></div><div class="card stat">🔥 <b data-streak>${data.streak}</b><small>连续答对</small></div></div>`}
function score(ok){data.attempts++;if(ok){data.xp+=10;data.correct++;data.streak++;toast("答对了！ +10 XP")}else{data.xp=Math.max(0,data.xp-5);data.streak=0;toast("答错了！ -5 XP")}save()}
function showHome(){$("pageTitle").textContent="汉语阅读空间";$("content").innerHTML=`<section class="hero"><div class="hero-main"><h3>日积月累，终有所成。</h3><p>通过课文、译文、词汇闪卡、句型闪卡、选词填空与阅读理解，循序渐进地练习汉语。</p><button class="btn" onclick="openLesson(0)">开始学习 →</button></div><div class="card"><h2>我的学习</h2><p>等级：<b data-level>1</b></p><p>经验值：<b data-xp>0</b> XP</p><p>连续答对：<b data-streak>0</b></p><p class="muted">答题正确：${data.correct} / ${data.attempts}</p></div></section>${stats()}<h2>选择练习</h2><div class="lessons">${lessons.map((l,i)=>`<div class="card lesson" onclick="openLesson(${i})"><div class="muted">练习 ${i+1}</div><h3>${l.title}</h3><button class="btn red">进入练习</button></div>`).join("")}</div>`;updateStats()}
function openLesson(i){lesson=i;flash=0;revealed=false;qIndex=0;fillIndex=0;readIndex=0;patternIndex=0;$("pageTitle").textContent=`练习 ${i+1} · ${lessons[i].title}`;document.querySelectorAll(".menu button").forEach((b,j)=>b.classList.toggle("active",j===i));render("课文");side.classList.remove("open")}
function render(tab){let l=lessons[lesson];let tabs=["课文","译文","词汇闪卡","句型闪卡","词汇选择","选词填空","阅读理解"];let html=stats()+`<div class="tabs">${tabs.map(t=>`<button class="btn ${t===tab?"red":""}" onclick="render('${t}')">${t}</button>`).join("")}</div><div class="card">`;
if(tab==="课文")html+=`<h2 class="lesson-page-title">${l.title}</h2><p class="muted lesson-page-author">${l.author}</p><div class="reading">${l.text.split(/\n+/).filter(p=>p.trim()).map(p=>`<p>${p}</p>`).join("")}</div>`;
if(tab==="译文")html+=translation(l);
if(tab==="词汇闪卡")html+=vocabCard(l);
if(tab==="句型闪卡")html+=patternCard(l);
if(tab==="词汇选择")html+=quiz(l);
if(tab==="选词填空")html+=fill(l);
if(tab==="阅读理解")html+=reading(l);
html+="</div>";$("content").innerHTML=html;updateStats()}
function translation(l){
const viTitles=["Dựa vào bộ thủ biểu ý để đoán nghĩa của từ","Chữ Hán phồn thể và giản thể, mỗi bên đều có thế mạnh riêng","Hai điều “kỵ” khi đọc sách"];
const viAuthors=["《拾级汉语泛读课本》第五级","Từ Tông Vĩ · 中国新闻网","Trần Tiên Đạt · 《北京日报》"];
return `<h2 class="lesson-page-title translation-title">${viTitles[lesson]}</h2><p class="muted lesson-page-author translation-author">${viAuthors[lesson]}</p><div class="reading translation-text">${l.translation.split(/\n+/).filter(p=>p.trim()).map(p=>`<p>${p}</p>`).join("")}</div>`}
function vocabCard(l){let v=l.vocab[flash%l.vocab.length];return `<div class="flash"><div class="muted">词汇 ${flash%l.vocab.length+1} / ${l.vocab.length}</div><div class="flash-word">${v[0]}</div><div class="flash-pinyin">${revealed?v[1]:"••••••"}</div><div class="flash-meaning">${revealed?v[2]:"点击按钮显示词义和拼音"}</div><button class="btn" onclick="revealed=true;render('词汇闪卡')">显示词义 / 拼音</button> <button class="btn red" onclick="flash++;revealed=false;render('词汇闪卡')">下一个 →</button></div>`}
function patternCard(l){let p=l.patterns[patternIndex%l.patterns.length];return `<div class="flash"><div class="muted">句型 ${patternIndex%l.patterns.length+1} / ${l.patterns.length}</div><div class="flash-word" style="font-size:46px">${p[0]}</div><div class="flash-meaning">${revealed?`<p><b>中文解释：</b>${p[1]}</p><p><b>越南语：</b>${p[2]}</p><p><b>课文例句：</b>${p[3]}</p>`:"点击按钮显示用法、越南语和课文例句"}</div><button class="btn" onclick="revealed=true;render('句型闪卡')">显示用法</button> <button class="btn red" onclick="patternIndex++;revealed=false;render('句型闪卡')">下一个 →</button></div>`}
function quiz(l){let n=qIndex%l.quiz.length,q=l.quiz[n];return `<h2>词汇选择</h2><p class="muted">第 ${n+1} / ${l.quiz.length} 题</p><p class="question">${q[0]}</p><div class="answers">${q[1].map((x,i)=>`<button class="answer" onclick="answerQuiz(${i},${q[2]})">${x}</button>`).join("")}</div><div id="fb"></div>`}
function answerQuiz(i,a){if($("fb").dataset.done)return;$("fb").dataset.done="1";document.querySelectorAll(".answer").forEach((b,j)=>{if(j===a)b.classList.add("correct");if(j===i&&i!==a)b.classList.add("wrong");b.disabled=true});score(i===a);let q=lessons[lesson].quiz[qIndex%lessons[lesson].quiz.length];qIndex++;let last=qIndex%lessons[lesson].quiz.length===0;$("fb").innerHTML=`<div class="feedback">${i===a?"✅ 回答正确！":"❌ 回答错误！"}<br>正确答案：<b>${q[1][a]}</b><br>${q[3]}<br><button class="btn red" style="margin-top:14px" onclick="render('词汇选择')">${last?"完成":"下一题 →"}</button></div>`}
function fill(l){let arr=fillQuiz[lesson],n=fillIndex%arr.length,q=arr[n];return `<h2>选词填空</h2><p class="muted">第 ${n+1} / ${arr.length} 题</p><p class="question">${q[0]}</p><div class="answers">${q[1].map((x,i)=>`<button class="answer" onclick="fillAns(${i},${q[2]})">${x}</button>`).join("")}</div><div id="fb"></div>`}
function fillAns(i,a){if($("fb").dataset.done)return;$("fb").dataset.done="1";let arr=fillQuiz[lesson],q=arr[fillIndex%arr.length];let ok=i===a;score(ok);document.querySelectorAll(".answer").forEach((b,j)=>{if(j===a)b.classList.add("correct");if(j===i&&i!==a)b.classList.add("wrong");b.disabled=true});let last=fillIndex%arr.length===arr.length-1;$("fb").innerHTML=`<div class="feedback">${ok?"✅ 回答正确！":"❌ 回答错误！"}<br>正确答案：<b>${q[1][a]}</b><br>${q[3]}<br><button class="btn red" style="margin-top:14px" onclick="fillIndex++;render('选词填空')">${last?"完成":"下一题 →"}</button></div>`}
function reading(l){
let arr=readQuiz[lesson],n=readIndex%arr.length,q=arr[n];
return `<h2>阅读理解</h2><p class="muted">第 ${n+1} / ${arr.length} 题</p><div class="reading">${q[0]}</div><p class="question">${q[1]}</p><div class="answers">${q[2].map((x,i)=>`<button class="answer" onclick="readAns(${i},${q[3]})">${x}</button>`).join("")}</div><div id="fb"></div>`}
function readAns(i,a){
if($("fb").dataset.done)return;
$("fb").dataset.done="1";
document.querySelectorAll(".answer").forEach((b,j)=>{if(j===a)b.classList.add("correct");if(j===i&&i!==a)b.classList.add("wrong");b.disabled=true});
let arr=readQuiz[lesson],q=arr[readIndex%arr.length],ok=i===a;
score(ok);readIndex++;
let last=readIndex%arr.length===0;
$("fb").innerHTML=`<div class="feedback">${ok?"✅ 回答正确！":"❌ 回答错误！"}<br>正确答案：<b>${q[2][a]}</b><br>${q[4]}<br><button class="btn red" style="margin-top:14px" onclick="render('阅读理解')">${last?"完成":"下一题 →"}</button></div>`}
function toggleDark(){data.dark=!data.dark;document.body.classList.toggle("dark",data.dark);save()}
function resetData(){if(confirm("确定要重置学习进度吗？")){data={xp:0,streak:0,correct:0,attempts:0,dark:data.dark};save();showHome()}}
function toast(t){let x=$("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1600)}
document.body.classList.toggle("dark",data.dark);showHome();
</script>
</body>
</html>
